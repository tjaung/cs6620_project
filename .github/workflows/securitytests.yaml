name: Security Tests

on:
  workflow_dispatch:
    inputs:
      scanners:
        description: "Comma-separated scanners to run: sast, pentest, or sast,pentest."
        required: false
        type: string
        default: "sast"
      pentest_target_url:
        description: "Target API URL for pentest scans. Required when scanners includes pentest."
        required: false
        type: string
        default: ""
      pentest_target_paths:
        description: "Comma-separated endpoint paths to scan against a Dockerized app running in GitHub Actions."
        required: false
        type: string
        default: ""
      app_dockerfile:
        description: "Dockerfile path for the app to run during local pentest scans."
        required: false
        type: string
        default: "Dockerfile"
      app_context:
        description: "Docker build context for the app to run during local pentest scans."
        required: false
        type: string
        default: "."
      app_port:
        description: "Port exposed by the app container during local pentest scans."
        required: false
        type: string
        default: "3000"
      app_health_path:
        description: "Health check path for the app container during local pentest scans."
        required: false
        type: string
        default: "/health"
      pentest_docker_image:
        description: "Docker image tag for the pentest API service used during local pentest scans."
        required: false
        type: string
        default: "security-test-pentest:local"
      security_platform_repository:
        description: "Repository containing the pentest scanner source."
        required: false
        type: string
        default: "tjaung/cs6620_project"
      security_platform_ref:
        description: "Branch, tag, or SHA containing the pentest scanner source."
        required: false
        type: string
        default: "tj/connect-all"
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region where the S3 bucket and Lambda exist."
        required: false
        type: string
        default: "us-east-1"
      aws_role_arn:
        description: "IAM role ARN that GitHub Actions assumes through OIDC."
        required: false
        type: string
        default: ""
      artifact_bucket:
        description: "S3 bucket used for repo.zip and result.json artifacts."
        required: false
        type: string
        default: ""
      lambda_function_name:
        description: "Lambda function that reads the uploaded repo zip."
        required: false
        type: string
        default: ""
      scanners:
        description: "Comma-separated scanners to run: sast, pentest, or sast,pentest."
        required: false
        type: string
        default: "sast"
      pentest_target_url:
        description: "Target API URL for pentest scans. Required when scanners includes pentest."
        required: false
        type: string
        default: ""
      pentest_target_paths:
        description: "Comma-separated endpoint paths to scan against a Dockerized app running in GitHub Actions."
        required: false
        type: string
        default: ""
      app_dockerfile:
        description: "Dockerfile path for the app to run during local pentest scans."
        required: false
        type: string
        default: "Dockerfile"
      app_context:
        description: "Docker build context for the app to run during local pentest scans."
        required: false
        type: string
        default: "."
      app_port:
        description: "Port exposed by the app container during local pentest scans."
        required: false
        type: string
        default: "3000"
      app_health_path:
        description: "Health check path for the app container during local pentest scans."
        required: false
        type: string
        default: "/health"
      pentest_docker_image:
        description: "Docker image tag for the pentest API service used during local pentest scans."
        required: false
        type: string
        default: "security-test-pentest:local"
      security_platform_repository:
        description: "Repository containing the pentest scanner source."
        required: false
        type: string
        default: "tjaung/cs6620_project"
      security_platform_ref:
        description: "Branch, tag, or SHA containing the pentest scanner source."
        required: false
        type: string
        default: "tj/connect-all"
    secrets:
      aws_access_key_id:
        description: "Temporary Learner Lab AWS access key ID. Only needed when OIDC role is unavailable."
        required: false
      aws_secret_access_key:
        description: "Temporary Learner Lab AWS secret access key. Only needed when OIDC role is unavailable."
        required: false
      aws_session_token:
        description: "Temporary Learner Lab AWS session token. Only needed when OIDC role is unavailable."
        required: false

jobs:
  security-tests:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Plan security scan modes
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const scanners = "${{ inputs.scanners }}"
            .split(",")
            .map((scanner) => scanner.trim().toLowerCase())
            .filter(Boolean);
          const uniqueScanners = [...new Set(scanners.length > 0 ? scanners : ["sast"])];
          const runLocalPentest = uniqueScanners.includes("pentest") && "${{ inputs.pentest_target_paths }}" !== "";
          const lambdaScanners = uniqueScanners.filter((scanner) => scanner !== "pentest" || !runLocalPentest);

          console.log(`RUN_LOCAL_PENTEST=${runLocalPentest}`);
          console.log(`RUN_LAMBDA=${lambdaScanners.length > 0}`);
          console.log(`LAMBDA_SCANNERS=${lambdaScanners.join(",")}`);
          NODE

      - name: Configure AWS credentials with OIDC
        if: ${{ env.RUN_LAMBDA == 'true' && (inputs.aws_role_arn != '' || vars.SECURITY_SCAN_AWS_ROLE_ARN != '') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn || vars.SECURITY_SCAN_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || vars.SECURITY_SCAN_AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials with Learner Lab secrets
        if: ${{ env.RUN_LAMBDA == 'true' && inputs.aws_role_arn == '' && vars.SECURITY_SCAN_AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-session-token: ${{ secrets.aws_session_token }}
          aws-region: ${{ inputs.aws_region || vars.SECURITY_SCAN_AWS_REGION || 'us-east-1' }}

      - name: Package repository
        if: ${{ env.RUN_LAMBDA == 'true' }}
        run: |
          zip -r repo.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "dist/*" \
            -x "*/dist/*" \
            -x "build/*" \
            -x "*/build/*"

      - name: Upload repository zip to S3
        if: ${{ env.RUN_LAMBDA == 'true' }}
        env:
          ARTIFACT_BUCKET: ${{ inputs.artifact_bucket || vars.SECURITY_SCAN_ARTIFACT_BUCKET }}
          S3_KEY: github/${{ github.repository_owner }}-${{ github.event.repository.name }}/${{ github.run_id }}/repo.zip
        run: |
          aws s3 cp repo.zip "s3://${ARTIFACT_BUCKET}/${S3_KEY}"
          echo "S3_KEY=${S3_KEY}" >> "$GITHUB_ENV"

      - name: Invoke repo reader Lambda
        if: ${{ env.RUN_LAMBDA == 'true' }}
        env:
          ARTIFACT_BUCKET: ${{ inputs.artifact_bucket || vars.SECURITY_SCAN_ARTIFACT_BUCKET }}
          LAMBDA_FUNCTION_NAME: ${{ inputs.lambda_function_name || vars.SECURITY_SCAN_LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda invoke \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --cli-binary-format raw-in-base64-out \
            --payload "{
              \"repo\": \"${{ github.repository }}\",
              \"sha\": \"${{ github.sha }}\",
              \"runId\": \"${{ github.run_id }}\",
              \"s3Bucket\": \"${ARTIFACT_BUCKET}\",
              \"s3Key\": \"${S3_KEY}\",
              \"scanners\": \"${LAMBDA_SCANNERS}\",
              \"pentestTargetUrl\": \"${{ inputs.pentest_target_url }}\"
            }" \
            lambda-response.json

      - name: Print security scan results
        if: ${{ env.RUN_LAMBDA == 'true' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('lambda-response.json', 'utf8'));
          const body = typeof raw.body === 'string' ? JSON.parse(raw.body) : raw;

          if (!body || typeof body !== 'object') {
            console.error('Lambda returned an invalid response.');
            console.error(JSON.stringify(raw, null, 2));
            process.exit(1);
          }

          const lines = [];

          lines.push('Security Scan Results');
          lines.push('=====================');
          lines.push(`Repo: ${body.repo}`);
          lines.push(`SHA: ${body.sha}`);
          lines.push(`Run ID: ${body.runId}`);
          lines.push(`Status: ${body.success && body.passed ? 'PASSED' : 'FAILED'}`);
          lines.push(`Scanners: ${(body.scanners || []).join(', ')}`);

          if (body.sast) {
            lines.push('');
            lines.push('SAST');
            lines.push('----');
            lines.push(`Service: ${body.sast.serviceUrl || 'not configured'}`);
            if (body.sast.error) {
              lines.push(`Error: ${body.sast.error}`);
            } else {
              lines.push(`Files discovered: ${body.sast.filesDiscovered}`);
              lines.push(`Source files matched: ${body.sast.sourceFilesMatched}`);
              lines.push(`Files scanned: ${body.sast.filesScanned}`);
              lines.push(`Files skipped: ${body.sast.filesSkipped}`);
              lines.push(`Files failed: ${body.sast.filesFailed}`);
              lines.push(`Total vulnerabilities: ${body.sast.summary.totalVulnerabilities}`);
              lines.push(`High: ${body.sast.summary.high}`);
              lines.push(`Medium: ${body.sast.summary.medium}`);
              lines.push(`Low: ${body.sast.summary.low}`);
            }

            for (const finding of body.sast.vulnerabilities || []) {
              lines.push('');
              lines.push(`[${finding.severity}] ${finding.file}:${finding.line} ${finding.name}`);
              lines.push(finding.description);
              lines.push(finding.message);
              if (finding.evidence) {
                lines.push(`Evidence: ${finding.evidence}`);
              }
            }
          }

          if (body.pentest) {
            lines.push('');
            lines.push('Pentest');
            lines.push('-------');
            lines.push(`Service: ${body.pentest.serviceUrl || 'not configured'}`);
            lines.push(`Target: ${body.pentest.targetUrl || 'not provided'}`);
            if (body.pentest.error) {
              lines.push(`Error: ${body.pentest.error}`);
            } else {
              lines.push(`Total tests: ${body.pentest.summary.totalTests}`);
              lines.push(`Passed: ${body.pentest.summary.passed}`);
              lines.push(`Failed: ${body.pentest.summary.failed}`);
              lines.push(`Warnings: ${body.pentest.summary.warnings}`);
              lines.push(`Errors: ${body.pentest.summary.errors}`);
            }

            for (const test of body.pentest.results || []) {
              lines.push('');
              lines.push(`[${test.status}] ${test.id} ${test.name}`);
              lines.push(test.details || '');
              for (const finding of test.findings || []) {
                lines.push(`- ${finding.issue || JSON.stringify(finding)}`);
              }
            }
          }

          console.log(lines.join('\n'));

          fs.appendFileSync(process.env.GITHUB_ENV, `LAMBDA_SCAN_PASSED=${body.success && body.passed}\n`);
          NODE

      - name: Build local pentest target app
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          if [ ! -f "${{ inputs.app_dockerfile }}" ]; then
            echo "Could not find Dockerfile at '${{ inputs.app_dockerfile }}'."
            echo "Set app_dockerfile to the Dockerfile path in the repo that calls this workflow."
            exit 1
          fi

          if [ ! -d "${{ inputs.app_context }}" ]; then
            echo "Could not find Docker build context directory at '${{ inputs.app_context }}'."
            echo "Set app_context to the directory Docker should build from."
            exit 1
          fi

          docker build \
            -f "${{ inputs.app_dockerfile }}" \
            -t security-test-target \
            "${{ inputs.app_context }}"

      - name: Start local pentest target app
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          docker run -d \
            --name security-test-target \
            -p "127.0.0.1:${{ inputs.app_port }}:${{ inputs.app_port }}" \
            security-test-target

      - name: Wait for local pentest target app
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:${{ inputs.app_port }}${{ inputs.app_health_path }}"; then
              exit 0
            fi
            sleep 2
          done

          docker logs security-test-target
          exit 1

      - name: Checkout security platform for local pentest
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.security_platform_repository }}
          ref: ${{ inputs.security_platform_ref }}
          path: .security-platform

      - name: Build local pentest service image
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          docker build \
            -f .security-platform/pentest/backend/Dockerfile \
            -t "${{ inputs.pentest_docker_image }}" \
            .security-platform/pentest/backend

      - name: Start local pentest service
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          docker run -d \
            --name security-test-pentest \
            --add-host=host.docker.internal:host-gateway \
            -p "127.0.0.1:3001:3000" \
            "${{ inputs.pentest_docker_image }}"

      - name: Wait for local pentest service
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3001/health"; then
              exit 0
            fi
            sleep 2
          done

          docker logs security-test-pentest
          exit 1

      - name: Run local pentest scans
        if: ${{ env.RUN_LOCAL_PENTEST == 'true' }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          async function main() {
            const paths = "${{ inputs.pentest_target_paths }}"
              .split(",")
              .map((path) => path.trim())
              .filter(Boolean)
              .map((path) => path.startsWith("/") ? path : `/${path}`);

            if (paths.length === 0) {
              console.error("No pentest target paths were provided.");
              process.exit(1);
            }

            const baseTargetUrl = "http://host.docker.internal:${{ inputs.app_port }}";
            const results = [];

            for (const path of paths) {
              const targetUrl = `${baseTargetUrl}${path}`;
              console.log(`Running pentest against ${targetUrl}`);

              const response = await fetch("http://127.0.0.1:3001/scan", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ targetUrl })
              });
              const body = await response.json();

              if (!response.ok || body.success === false) {
                body.success = false;
                body.error = body.message || body.error || `Pentest request failed with ${response.status}`;
              }

              results.push(body);
            }

            fs.writeFileSync("local-pentest-response.json", JSON.stringify(results, null, 2));

            const lines = [];
            lines.push("Local Docker Pentest Results");
            lines.push("============================");

            let passed = true;
            for (const result of results) {
              const summary = result.summary || {};
              const resultPassed = result.success !== false && (summary.failed || 0) === 0 && (summary.errors || 0) === 0;
              passed = passed && resultPassed;

              lines.push("");
              lines.push(`Target: ${result.targetUrl || "unknown"}`);
              lines.push(`Status: ${resultPassed ? "PASSED" : "FAILED"}`);

              if (result.error) {
                lines.push(`Error: ${result.error}`);
              } else {
                lines.push(`Total tests: ${summary.totalTests}`);
                lines.push(`Passed: ${summary.passed}`);
                lines.push(`Failed: ${summary.failed}`);
                lines.push(`Warnings: ${summary.warnings}`);
                lines.push(`Errors: ${summary.errors}`);
              }

              for (const test of result.results || []) {
                lines.push("");
                lines.push(`[${test.status}] ${test.id} ${test.name}`);
                if (test.details) {
                  lines.push(test.details);
                }
                for (const finding of test.findings || []) {
                  lines.push(`- ${finding.issue || JSON.stringify(finding)}`);
                }
              }
            }

            console.log(lines.join("\n"));

            fs.appendFileSync(process.env.GITHUB_ENV, `LOCAL_PENTEST_PASSED=${passed}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop local pentest containers
        if: always()
        run: |
          docker rm -f security-test-pentest 2>/dev/null || true
          docker rm -f security-test-target 2>/dev/null || true

      - name: Fail when security scans fail
        if: always()
        run: |
          if [ "${LAMBDA_SCAN_PASSED:-true}" != "true" ] || [ "${LOCAL_PENTEST_PASSED:-true}" != "true" ]; then
            exit 1
          fi
