name: Security Tests

on:
  workflow_dispatch:
    inputs:
      scanners:
        description: "Comma-separated scanners to run: sast, pentest, or sast,pentest."
        required: false
        type: string
        default: "sast"
      pentest_target_url:
        description: "Target API URL for pentest scans. Required when scanners includes pentest."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region where the S3 bucket and Lambda exist."
        required: false
        type: string
        default: "us-east-1"
      aws_role_arn:
        description: "IAM role ARN that GitHub Actions assumes through OIDC."
        required: false
        type: string
        default: ""
      artifact_bucket:
        description: "S3 bucket used for repo.zip and result.json artifacts."
        required: false
        type: string
        default: ""
      lambda_function_name:
        description: "Lambda function that reads the uploaded repo zip."
        required: false
        type: string
        default: ""
      scanners:
        description: "Comma-separated scanners to run: sast, pentest, or sast,pentest."
        required: false
        type: string
        default: "sast"
      pentest_target_url:
        description: "Target API URL for pentest scans. Required when scanners includes pentest."
        required: false
        type: string
        default: ""
    secrets:
      aws_access_key_id:
        description: "Temporary Learner Lab AWS access key ID. Only needed when OIDC role is unavailable."
        required: false
      aws_secret_access_key:
        description: "Temporary Learner Lab AWS secret access key. Only needed when OIDC role is unavailable."
        required: false
      aws_session_token:
        description: "Temporary Learner Lab AWS session token. Only needed when OIDC role is unavailable."
        required: false

jobs:
  security-tests:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        if: ${{ inputs.aws_role_arn != '' || vars.SECURITY_SCAN_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn || vars.SECURITY_SCAN_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || vars.SECURITY_SCAN_AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials with Learner Lab secrets
        if: ${{ inputs.aws_role_arn == '' && vars.SECURITY_SCAN_AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.aws_session_token || secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region || vars.SECURITY_SCAN_AWS_REGION || 'us-east-1' }}

      - name: Package repository
        run: |
          zip -r repo.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "dist/*" \
            -x "*/dist/*" \
            -x "build/*" \
            -x "*/build/*"

      - name: Upload repository zip to S3
        env:
          ARTIFACT_BUCKET: ${{ inputs.artifact_bucket || vars.SECURITY_SCAN_ARTIFACT_BUCKET }}
          S3_KEY: github/${{ github.repository_owner }}-${{ github.event.repository.name }}/${{ github.run_id }}/repo.zip
        run: |
          aws s3 cp repo.zip "s3://${ARTIFACT_BUCKET}/${S3_KEY}"
          echo "S3_KEY=${S3_KEY}" >> "$GITHUB_ENV"

      - name: Invoke repo reader Lambda
        env:
          ARTIFACT_BUCKET: ${{ inputs.artifact_bucket || vars.SECURITY_SCAN_ARTIFACT_BUCKET }}
          LAMBDA_FUNCTION_NAME: ${{ inputs.lambda_function_name || vars.SECURITY_SCAN_LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda invoke \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --cli-binary-format raw-in-base64-out \
            --payload "{
              \"repo\": \"${{ github.repository }}\",
              \"sha\": \"${{ github.sha }}\",
              \"runId\": \"${{ github.run_id }}\",
              \"s3Bucket\": \"${ARTIFACT_BUCKET}\",
              \"s3Key\": \"${S3_KEY}\",
              \"scanners\": \"${{ inputs.scanners }}\",
              \"pentestTargetUrl\": \"${{ inputs.pentest_target_url }}\"
            }" \
            lambda-response.json

      - name: Print security scan results
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('lambda-response.json', 'utf8'));
          const body = typeof raw.body === 'string' ? JSON.parse(raw.body) : raw;

          if (!body || typeof body !== 'object') {
            console.error('Lambda returned an invalid response.');
            console.error(JSON.stringify(raw, null, 2));
            process.exit(1);
          }

          const lines = [];

          lines.push('Security Scan Results');
          lines.push('=====================');
          lines.push(`Repo: ${body.repo}`);
          lines.push(`SHA: ${body.sha}`);
          lines.push(`Run ID: ${body.runId}`);
          lines.push(`Status: ${body.success && body.passed ? 'PASSED' : 'FAILED'}`);
          lines.push(`Scanners: ${(body.scanners || []).join(', ')}`);

          if (body.sast) {
            lines.push('');
            lines.push('SAST');
            lines.push('----');
            lines.push(`Service: ${body.sast.serviceUrl || 'not configured'}`);
            if (body.sast.error) {
              lines.push(`Error: ${body.sast.error}`);
            } else {
              lines.push(`Files discovered: ${body.sast.filesDiscovered}`);
              lines.push(`Source files matched: ${body.sast.sourceFilesMatched}`);
              lines.push(`Files scanned: ${body.sast.filesScanned}`);
              lines.push(`Files skipped: ${body.sast.filesSkipped}`);
              lines.push(`Files failed: ${body.sast.filesFailed}`);
              lines.push(`Total vulnerabilities: ${body.sast.summary.totalVulnerabilities}`);
              lines.push(`High: ${body.sast.summary.high}`);
              lines.push(`Medium: ${body.sast.summary.medium}`);
              lines.push(`Low: ${body.sast.summary.low}`);
            }

            for (const finding of body.sast.vulnerabilities || []) {
              lines.push('');
              lines.push(`[${finding.severity}] ${finding.file}:${finding.line} ${finding.name}`);
              lines.push(finding.description);
              lines.push(finding.message);
              if (finding.evidence) {
                lines.push(`Evidence: ${finding.evidence}`);
              }
            }
          }

          if (body.pentest) {
            lines.push('');
            lines.push('Pentest');
            lines.push('-------');
            lines.push(`Service: ${body.pentest.serviceUrl || 'not configured'}`);
            lines.push(`Target: ${body.pentest.targetUrl || 'not provided'}`);
            if (body.pentest.error) {
              lines.push(`Error: ${body.pentest.error}`);
            } else {
              lines.push(`Total tests: ${body.pentest.summary.totalTests}`);
              lines.push(`Passed: ${body.pentest.summary.passed}`);
              lines.push(`Failed: ${body.pentest.summary.failed}`);
              lines.push(`Warnings: ${body.pentest.summary.warnings}`);
              lines.push(`Errors: ${body.pentest.summary.errors}`);
            }

            for (const test of body.pentest.results || []) {
              lines.push('');
              lines.push(`[${test.status}] ${test.id} ${test.name}`);
              lines.push(test.details || '');
              for (const finding of test.findings || []) {
                lines.push(`- ${finding.issue || JSON.stringify(finding)}`);
              }
            }
          }

          console.log(lines.join('\n'));

          if (!body.success || !body.passed) {
            process.exit(1);
          }
          NODE
